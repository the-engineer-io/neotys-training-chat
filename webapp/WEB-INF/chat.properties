# Rooms of the Neotys Training Chat, listed in display order.
# StartUp is the hidden room users are placed in right after login.
NeoLoad=Talk about NeoLoad: designing user paths, correlation, scenarios and results.
Collaborative=Share projects and user paths with the rest of the team.
Cloud=Load generation from the cloud.
RIA=Rich Internet Applications: Flex, GWT, Ajax push and WebSocket.
StartUp=Startup chat room. Chatter is added to this after he logs in.
